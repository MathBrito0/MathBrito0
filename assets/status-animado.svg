<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Consolas, Monaco, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .title  { fill: #7dd3fc; font-size: 15px; letter-spacing: 2px; }
    .label  { fill: #64748b; font-size: 14px; }
    .value  { fill: #e2e8f0; font-size: 14px; }
    .cmd    { fill: #22d3ee; font-size: 14px; }
    .pct    { fill: #22d3ee; font-size: 14px; font-weight: bold; }
  </style>

  <!-- caixa externa -->
  <rect x="1" y="1" width="698" height="298" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>

  <!-- barra de titulo estilo terminal -->
  <rect x="1" y="1" width="698" height="34" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <rect x="1" y="20" width="698" height="15" fill="#111827"/>
  <circle cx="24" cy="18" r="5" fill="#ef4444"/>
  <circle cx="42" cy="18" r="5" fill="#eab308"/>
  <circle cx="60" cy="18" r="5" fill="#22c55e"/>
  <text x="350" y="23" text-anchor="middle" class="title">STATUS</text>

  <!-- titulo do corpo -->
  <text x="30" y="70" class="title">SYSTEM STATUS</text>

  <!-- barra de carregamento -->
  <rect x="30" y="86" width="400" height="18" rx="2" fill="#1e293b" stroke="#334155"/>
  <rect x="32" y="88" width="0" height="14" rx="1" fill="#22d3ee">
    <animate attributeName="width" values="0;320;320" keyTimes="0;0.6667;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- porcentagem em degraus, sincronizada com a barra -->
  <g class="pct">
    <text x="445" y="99">0%<animate attributeName="opacity" values="1;0" keyTimes="0;0.1667" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
    <text x="445" y="99" opacity="0">20%<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1667;0.3333" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
    <text x="445" y="99" opacity="0">40%<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3333;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
    <text x="445" y="99" opacity="0">60%<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.6667" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
    <text x="445" y="99" opacity="0">80%<animate attributeName="opacity" values="0;1" keyTimes="0;0.6667" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
  </g>

  <line x1="30" y1="120" x2="670" y2="120" stroke="#1e293b"/>

  <!-- informacoes fixas -->
  <text x="30" y="148" class="label">Focus</text>
  <text x="140" y="148" class="label">:</text>
  <text x="160" y="148" class="value">Blue Team / SOC</text>

  <text x="30" y="172" class="label">Environment</text>
  <text x="140" y="172" class="label">:</text>
  <text x="160" y="172" class="value">Cybersecurity</text>

  <text x="30" y="196" class="label">Mode</text>
  <text x="140" y="196" class="label">:</text>
  <text x="160" y="196" class="value">Continuous Learning</text>

  <line x1="30" y1="216" x2="670" y2="216" stroke="#1e293b"/>

  <!-- linhas de comando com efeito de digitacao -->
  <text x="30" y="245" class="cmd" opacity="0">&gt; Monitoring...
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.0833" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="30" y="269" class="cmd" opacity="0">&gt; Investigating...
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.3667" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="30" y="293" class="cmd" opacity="0">&gt; Improving...
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.7" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- cursor piscando -->
  <rect x="150" y="281" width="8" height="14" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
