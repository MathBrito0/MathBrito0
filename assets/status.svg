<svg viewBox="0 0 700 320" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Consolas, Monaco, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .title  { fill: #7dd3fc; font-size: 15px; letter-spacing: 2px; }
    .label  { fill: #64748b; font-size: 14px; }
    .value  { fill: #e2e8f0; font-size: 14px; }
    .cmd    { fill: #22d3ee; font-size: 14px; font-weight: bold; letter-spacing: 1px; }
    .pct    { fill: #22d3ee; font-size: 14px; font-weight: bold; }
  </style>

  <!-- caixa externa -->
  <rect x="1" y="1" width="698" height="318" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>

  <!-- barra de titulo estilo terminal -->
  <rect x="1" y="1" width="698" height="34" rx="8" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <rect x="1" y="20" width="698" height="15" fill="#111827"/>
  <circle cx="24" cy="18" r="5" fill="#ef4444"/>
  <circle cx="42" cy="18" r="5" fill="#eab308"/>
  <circle cx="60" cy="18" r="5" fill="#22c55e"/>
  <text x="350" y="23" text-anchor="middle" class="title">STATUS</text>

  <!-- titulo do corpo -->
  <text x="30" y="70" class="title">SYSTEM STATUS</text>

  <!-- barra de carregamento (vai ate 100%) -->
  <rect x="30" y="86" width="400" height="18" rx="2" fill="#1e293b" stroke="#334155"/>
  <rect x="32" y="88" width="0" height="14" rx="1" fill="#22d3ee">
    <animate attributeName="width" values="0;396;396" keyTimes="0;0.625;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- porcentagem em degraus, sincronizada com a barra -->
  <g class="pct">
    <text x="445" y="99">0%<animate attributeName="opacity" values="1;0" keyTimes="0;0.1042" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
    <text x="445" y="99" opacity="0">20%<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1042;0.2083" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
    <text x="445" y="99" opacity="0">40%<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2083;0.3125" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
    <text x="445" y="99" opacity="0">60%<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3125;0.4167" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
    <text x="445" y="99" opacity="0">80%<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4167;0.5208" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
    <text x="445" y="99" opacity="0">100%<animate attributeName="opacity" values="0;1" keyTimes="0;0.5208" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
  </g>

  <line x1="30" y1="120" x2="670" y2="120" stroke="#1e293b"/>

  <!-- informacoes fixas -->
  <text x="30" y="148" class="label">Focus</text>
  <text x="140" y="148" class="label">:</text>
  <text x="160" y="148" class="value">Blue Team / SOC</text>

  <text x="30" y="172" class="label">Environment</text>
  <text x="140" y="172" class="label">:</text>
  <text x="160" y="172" class="value">Cybersecurity</text>

  <text x="30" y="196" class="label">Mode</text>
  <text x="140" y="196" class="label">:</text>
  <text x="160" y="196" class="value">Continuous Learning</text>

  <line x1="30" y1="216" x2="670" y2="216" stroke="#1e293b"/>

  <!-- mensagens com icone, aparecem uma embaixo da outra assim que a barra completa 100% -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.625" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
    <g transform="translate(30,229)">
      <circle cx="8" cy="8" r="6.5" stroke="#22d3ee" stroke-width="1.4" fill="none"/>
      <circle cx="8" cy="8" r="3.2" stroke="#22d3ee" stroke-width="1.4" fill="none"/>
      <circle cx="8" cy="8" r="0.9" fill="#22d3ee"/>
      <line x1="8" y1="8" x2="13.5" y2="3" stroke="#22d3ee" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <text x="52" y="242" class="cmd">&gt; DETECT</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.675" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
    <g transform="translate(30,251)">
      <circle cx="6.5" cy="6.5" r="5" stroke="#22d3ee" stroke-width="1.4" fill="none"/>
      <line x1="10.2" y1="10.2" x2="15" y2="15" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <text x="52" y="264" class="cmd">&gt; INVESTIGATE</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.725" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
    <g transform="translate(30,273)">
      <rect x="3" y="7" width="10" height="8" rx="1.5" stroke="#22d3ee" stroke-width="1.4" fill="none"/>
      <path d="M5.5 7 V5 a2.5 2.5 0 0 1 5 0 V7" stroke="#22d3ee" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <circle cx="8" cy="11" r="1" fill="#22d3ee"/>
    </g>
    <text x="52" y="286" class="cmd">&gt; RESPOND</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.775" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
    <g transform="translate(30,295)">
      <path d="M8 1 L14.5 3.5 V8.5 C14.5 12 11.7 14.3 8 15.5 C4.3 14.3 1.5 12 1.5 8.5 V3.5 Z" stroke="#22d3ee" stroke-width="1.4" fill="none" stroke-linejoin="round"/>
      <path d="M5.3 8.2 L7.2 10.1 L10.8 6.3" stroke="#22d3ee" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="52" y="308" class="cmd">&gt; DEFEND</text>
  </g>

  <!-- cursor piscando, so aparece junto da ultima mensagem -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.775" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
    <rect x="124" y="295" width="8" height="14" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
